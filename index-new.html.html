<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic English Cards — Animated</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#17243d;background:#eaf4ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:25px auto;padding:16px}.hero{background:linear-gradient(115deg,#3259e8,#9b50db);border-radius:24px;color:white;padding:24px;text-align:center}h1{margin:0;font-size:2rem}.sub{opacity:.9}.tabs{display:flex;gap:12px;margin:18px 0}.tabs button{flex:1}select,button{font:inherit;border:0;border-radius:13px;padding:12px 16px}select{width:100%;background:white;border:1px solid #cad5eb;margin:12px 0}button{background:#315ee9;color:white;cursor:pointer;font-weight:700}button:disabled{opacity:.5}.secondary{background:#eef2ff;color:#2644b1}.active{background:#315ee9!important;color:white!important}.card{background:white;border-radius:24px;box-shadow:0 8px 30px #17366b22;padding:24px;margin-top:16px;text-align:center}.emoji{font-size:100px;line-height:1.4;display:inline-block}.scene{height:160px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;perspective:550px}.word{font-size:2.4rem;font-weight:800;margin:0}.translation{color:#576477;font-size:1.2rem}.sentence{font-size:1.12rem}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.quiz{margin-top:20px;text-align:left;background:#f6f9ff;border-radius:16px;padding:18px}.choices{display:grid;gap:9px;margin-top:12px}.choices button{text-align:left;background:white;color:#17243d;border:2px solid #dbe4f5}.choices button.good{border-color:#20a15c;background:#d9f9e7}.choices button.bad{border-color:#d74e4e;background:#ffe4e4}.feedback{min-height:30px;font-weight:800;text-align:center}.nav{display:flex;gap:12px;justify-content:space-between;margin-top:16px}.small{font-size:.85rem;color:#64748b}.stats{margin:12px 0;color:#52627e;text-align:center}.butterfly{position:relative;width:140px;height:120px;animation:fly 3.2s ease-in-out infinite;transform-style:preserve-3d}.wing{position:absolute;top:12px;width:65px;height:90px;background:radial-gradient(ellipse at 40% 35%,#68efff,#178de9 55%,#102c67 80%);border:3px solid #142440;box-shadow:inset 0 0 12px #baf6ff}.wing.left{left:3px;border-radius:90% 20% 75% 30%;transform-origin:right center;animation:wingL .4s ease-in-out infinite alternate}.wing.right{right:3px;border-radius:20% 90% 30% 75%;transform-origin:left center;animation:wingR .4s ease-in-out infinite alternate}.bodyfly{position:absolute;left:66px;top:32px;width:9px;height:65px;border-radius:50%;background:#142440;z-index:2}.bodyfly:before{content:'⌒';position:absolute;top:-22px;left:-7px;font-size:25px}.dolphin{animation:jump 2.5s ease-in-out infinite}.penguin{animation:waddle 1.2s ease-in-out infinite}.volcano{animation:rumble 1.8s infinite}.volcano:after{content:'🔥';position:absolute;font-size:38px;top:0;animation:eruption 1.8s infinite}.heart{animation:heartbeat 1.1s infinite}.house{animation:housebounce 2s infinite}.rainbow{animation:rainbow 2.8s infinite}.eagle{animation:fly 2.8s infinite}.turtle{animation:walk 3s infinite}.flower{animation:waddle 2.5s infinite}.umbrella{animation:waddle 2s infinite}.island{animation:float 3s infinite}.star{animation:heartbeat 1.7s infinite}.animated{animation:float 3s ease-in-out infinite}@keyframes fly{0%,100%{transform:translate(-15px,8px) rotate(-7deg)}50%{transform:translate(18px,-12px) rotate(7deg)}}@keyframes wingL{from{transform:rotateY(0deg)}to{transform:rotateY(72deg)}}@keyframes wingR{from{transform:rotateY(0deg)}to{transform:rotateY(-72deg)}}@keyframes jump{0%,100%{transform:translateY(25px) rotate(-15deg)}50%{transform:translateY(-30px) rotate(12deg)}}@keyframes waddle{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}@keyframes rumble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}@keyframes eruption{0%{transform:translateY(15px) scale(.4);opacity:0}50%{transform:translateY(-30px) scale(1.2);opacity:1}100%{transform:translateY(-65px) scale(.5);opacity:0}}@keyframes heartbeat{0%,100%{transform:scale(1)}35%{transform:scale(1.23)}60%{transform:scale(1.05)}}@keyframes housebounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes rainbow{0%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.12)}100%{opacity:.35;transform:scale(.8)}}@keyframes walk{0%,100%{transform:translateX(-25px)}50%{transform:translateX(25px)}}@keyframes float{0%,100%{transform:translateY(5px)}50%{transform:translateY(-12px)}}@media(prefers-reduced-motion:reduce){.scene *{animation:none!important}}@media(max-width:450px){.emoji{font-size:80px}.word{font-size:2rem}}
</style></head><body><main class="wrap"><header class="hero"><h1>✨ Magic English Cards</h1><div class="sub">See • Listen • Speak • Play • Remember</div></header><div class="tabs"><button id="learn" class="active">📚 Learn</button><button id="play" class="secondary">🎮 Play</button></div><label for="topic"><strong>Choose a topic</strong></label><select id="topic"><option value="all">All cards</option><option value="home">Home and Away</option><option value="values">Values</option><option value="animals">Animals</option><option value="nature">Nature</option><option value="feelings">Feelings</option><option value="everyday">Everyday Life</option></select><div class="stats" id="stats"></div><section class="card" id="card"><div class="scene" id="scene"></div><h2 class="word" id="word"></h2><div class="translation" id="translation"></div><p class="sentence" id="sentence"></p><div class="actions" id="actions"><button id="listen">🔊 Listen</button><button class="secondary" id="speak">🎤 Repeat</button></div><p id="speechstatus" class="small" aria-live="polite"></p><div class="quiz" id="quiz"><strong>🎮 Choose the correct meaning:</strong><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p></div><div class="nav" id="nav"><button class="secondary" id="prev">← Previous</button><button id="next">Next →</button></div><div id="result" hidden><h2 id="resultText"></h2><button id="again">Play again ↻</button></div></section><p class="small" style="text-align:center">Made for a student research project • AI-generated content should be checked by the teacher • Speech recognition depends on the browser and permissions.</p></main><script>

['nature','Volcano','Жанартау','🌋','A volcano can release hot lava.'],['nature','Waterfall','Сарқырама','🏞️','A waterfall is beautiful.'],['nature','Forest','Орман','🌲','Many animals live in the forest.'],['nature','Island','Арал','🏝️','An island is surrounded by water.'],['nature','Desert','Шөл','🏜️','A desert is usually dry.'],['nature','Rainbow','Кемпірқосақ','🌈','We can see a rainbow after rain.'],
['feelings','Excited','Қуанышты, толқулы','🤩','I am excited about the trip.'],['feelings','Worried','Алаңдаулы','😟','She is worried about the test.'],['feelings','Proud','Мақтан тұтатын','🥹','I am proud of my friend.'],['feelings','Surprised','Таңғалған','😲','He is surprised by the gift.'],['feelings','Bored','Зерігіп отырған','🥱','I feel bored today.'],['feelings','Nervous','Қобалжыған','😬','She feels nervous before the exam.'],

['values','Kindness','Мейірімділік','💛','Kindness makes people happy.'],['values','Honesty','Адалдық','🤝','Honesty is important.'],['values','Friendship','Достық','🫂','Friendship is a great gift.'],['values','Respect','Құрмет','🙏','We show respect to others.'],['values','Responsibility','Жауапкершілік','📋','Responsibility means doing your duties.'],['values','Helpfulness','Көмекшілдік','🙌','Helpfulness makes our class better.'],['values','Patience','Шыдамдылық','🧘','Patience helps us learn.'],['values','Courage','Батылдық','🦁','Courage helps us face challenges.'],['values','Generosity','Жомарттық','🎁','Generosity means sharing with others.'],['values','Politeness','Әдептілік','😊','Politeness means saying please and thank you.'],['values','Teamwork','Бірлескен жұмыс','👥','Teamwork helps us succeed.'],['values','Fairness','Әділдік','⚖️','Fairness means treating people equally.']
].map(([topic,word,kz,emoji,sentence])=>({topic,word,kz,emoji,sentence}));
const $=id=>document.getElementById(id);let list=[],pos=0,score=0,answered=false,mode='learn',finished=false;const qs=new URLSearchParams(location.search);const initialWord=qs.get('word');function speak(t){if(!('speechSynthesis' in window)){$('speechstatus').textContent='Audio is not supported in this browser.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function art(c){const s=$('scene');s.replaceChildren();if(c.word==='Butterfly'){s.innerHTML='<div class="butterfly" role="img" aria-label="Flying butterfly"><div class="wing left"></div><div class="wing right"></div><div class="bodyfly"></div></div>';return}const e=document.createElement('div');e.className='emoji '+({Dolphin:'dolphin',Penguin:'penguin',Volcano:'volcano',Kindness:'heart',House:'house',Rainbow:'rainbow',Eagle:'eagle',Turtle:'turtle',Garden:'flower',Umbrella:'umbrella',Island:'island',Excited:'star'}[c.word]||'animated');e.textContent=c.emoji;e.setAttribute('role','img');e.setAttribute('aria-label',c.word);s.append(e)}function render(){if(finished)return;const c=list[pos];if(!c)return;art(c);$('word').textContent=c.word;$('translation').textContent=c.kz;$('sentence').textContent=c.sentence;$('translation').hidden=mode==='play';$('sentence').hidden=mode==='play';$('actions').hidden=mode==='play';$('speechstatus').hidden=mode==='play';$('quiz').hidden=mode==='learn';$('stats').textContent=mode==='learn'?`Learn • Card ${pos+1} / ${list.length}`:`Play • Question ${pos+1} / ${list.length} • Score: ${score}`;$('feedback').textContent='';$('speechstatus').textContent='';answered=false;const pool=shuffle(cards.filter(x=>x.kz!==c.kz));const options=shuffle([c,...pool.slice(0,2)]);$('choices').replaceChildren();for(const o of options){const b=document.createElement('button');b.textContent=o.kz;b.onclick=()=>{if(answered)return;answered=true;const ok=o.kz===c.kz;b.classList.add(ok?'good':'bad');$('feedback').textContent=ok?'⭐ Excellent! Correct!':'Correct answer: '+c.kz;if(ok)score++;$('next').disabled=false;$('stats').textContent=`Play • Question ${pos+1} / ${list.length} • Score: ${score}`;for(const x of $('choices').children){x.disabled=true;if(x.textContent===c.kz)x.classList.add('good')}};$('choices').append(b)}$('prev').disabled=pos===0;$('next').disabled=mode==='play'&&!answered;$('next').textContent=pos===list.length-1?(mode==='play'?'Finish →':'Start again ↻'):'Next →';if(mode==='play')$('next').disabled=true;history.replaceState(null,'',location.pathname+'?word='+encodeURIComponent(c.word))}function setTopic(topic){list=topic==='all'?cards:cards.filter(c=>c.topic===topic);pos=0;score=0;finished=false;$('result').hidden=true;$('nav').hidden=false;$('scene').hidden=false;$('word').hidden=false;render()}function setMode(m){mode=m;$('learn').className=m==='learn'?'active':'secondary';$('play').className=m==='play'?'active':'secondary';setTopic($('topic').value)}$('topic').onchange=e=>setTopic(e.target.value);$('learn').onclick=()=>setMode('learn');$('play').onclick=()=>setMode('play');$('listen').onclick=()=>speak(list[pos].word+'. '+list[pos].sentence);$('speak').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('speechstatus').textContent='Microphone recognition is not supported here. Say the word aloud after listening.';return}const r=new SR();r.lang='en-US';r.onresult=e=>$('speechstatus').textContent='You said: '+e.results[0][0].transcript+' (check pronunciation with your teacher)';r.onerror=e=>$('speechstatus').textContent='Microphone unavailable: '+e.error;r.start();$('speechstatus').textContent='Listening…'};$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{if(mode==='play'&&!answered)return;if(pos===list.length-1&&mode==='play'){finished=true;$('result').hidden=false;$('nav').hidden=true;$('scene').hidden=true;$('word').hidden=true;$('quiz').hidden=true;$('translation').hidden=true;$('sentence').hidden=true;$('actions').hidden=true;$('speechstatus').hidden=true;$('stats').textContent='Quiz completed';$('resultText').textContent=`🏆 Your score: ${score} / ${list.length} (${Math.round(score/list.length*100)}%)`;return}pos=(pos+1)%list.length;if(pos===0)score=0;render()};$('again').onclick=()=>setTopic($('topic').value);if(initialWord){const c=cards.find(x=>x.word.toLowerCase()===initialWord.toLowerCase());if(c){$('topic').value=c.topic;setTopic(c.topic);pos=list.findIndex(x=>x.word===c.word);render()}else setTopic('all')}else setTopic('all');
</script></body></html>
