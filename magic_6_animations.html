<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic English Cards — Animated 6</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eaf1ff;color:#172443}.wrap{max-width:850px;margin:auto;padding:20px}header{background:linear-gradient(115deg,#315fe9,#9850d8);border-radius:24px;padding:24px;text-align:center;color:white}h1{margin:0;font-size:clamp(26px,6vw,44px)}header p{margin:8px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px;margin-top:22px}.card{background:white;border-radius:22px;padding:18px;text-align:center;box-shadow:0 7px 25px #273b7415}.scene{height:185px;position:relative;overflow:hidden;border-radius:16px;background:linear-gradient(#d8f3ff,#f5faff);perspective:650px}.word{font-size:26px;font-weight:800;margin:12px 0 0}.translation{color:#63708a;margin:3px}.sentence{font-size:14px;min-height:38px}.btn{border:0;border-radius:12px;background:#315fe9;color:white;padding:11px 15px;font-weight:700;cursor:pointer}.btn:focus-visible{outline:3px solid orange}.butterfly{position:absolute;left:50%;top:45%;width:0;height:0;animation:travel 6s ease-in-out infinite}.wing{position:absolute;top:-29px;width:49px;height:65px;background:radial-gradient(circle at 60% 40%,#7ef1ff 0 15%,#1aa2f1 40%,#172a87 78%);border:3px solid #172443;transform-origin:100% 55%;border-radius:80% 18% 72% 28%;animation:flapL .28s ease-in-out infinite alternate}.wing.left{left:-50px}.wing.right{left:1px;transform-origin:0 55%;border-radius:18% 80% 28% 72%;animation-name:flapR}.body{position:absolute;left:-4px;top:-22px;width:8px;height:48px;border-radius:50%;background:#172443;z-index:2}@keyframes flapL{from{transform:rotateY(5deg)}to{transform:rotateY(78deg)}}@keyframes flapR{from{transform:rotateY(-5deg)}to{transform:rotateY(-78deg)}}@keyframes travel{0%{transform:translate(-65px,30px) rotate(-12deg)}30%{transform:translate(40px,-30px) rotate(9deg)}60%{transform:translate(65px,15px) rotate(-8deg)}100%{transform:translate(-65px,30px) rotate(-12deg)}}.house{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:130px;height:100px;background:#ffcf93;border:4px solid #995b4e;border-radius:4px}.roof{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:85px solid transparent;border-right:85px solid transparent;border-bottom:78px solid #d76562}.doorframe{position:absolute;bottom:0;left:48px;width:38px;height:68px;background:#694b3b;perspective:350px}.door{width:100%;height:100%;background:#b77a4c;border:2px solid #563b31;transform-origin:left;animation:door 4s ease-in-out infinite}.door:after{content:'•';position:absolute;right:5px;top:30px;color:#ffe18c}@keyframes door{0%,15%,85%,100%{transform:rotateY(0)}40%,65%{transform:rotateY(-75deg)}}.window{position:absolute;left:13px;top:25px;width:28px;height:28px;background:#fdf3ac;border:4px solid white;animation:light 3s infinite alternate}@keyframes light{from{background:#7cbdde}to{background:#ffdf57}}.volcano{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:83px solid transparent;border-right:83px solid transparent;border-bottom:150px solid #78514a}.crater{position:absolute;bottom:148px;left:50%;transform:translateX(-50%);width:52px;height:13px;background:#f64a24;border-radius:50%}.lava{position:absolute;bottom:153px;left:50%;width:12px;height:18px;border-radius:50%;background:#ff6c15;animation:eruption 2.2s ease-out infinite}.lava.a{--x:-52px;animation-delay:0s}.lava.b{--x:20px;animation-delay:.5s}.lava.c{--x:65px;animation-delay:1s}.lava.d{--x:-15px;animation-delay:1.5s}@keyframes eruption{0%{transform:translate(0,0) scale(.6);opacity:1}75%{opacity:1}100%{transform:translate(var(--x),-125px) scale(.25);opacity:0}}.heart{position:absolute;left:50%;top:50%;font-size:108px;line-height:1;transform:translate(-50%,-50%);animation:beat 1s infinite}@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}35%{transform:translate(-50%,-50%) scale(1.2)}55%{transform:translate(-50%,-50%) scale(1.05)}70%{transform:translate(-50%,-50%) scale(1.17)}}.sun{position:absolute;left:50%;top:50%;width:92px;height:92px;background:#ffd348;border-radius:50%;box-shadow:0 0 35px #ffdc68;transform:translate(-50%,-50%)}.rays{position:absolute;left:50%;top:50%;width:145px;height:145px;transform:translate(-50%,-50%);animation:spin 13s linear infinite;background:repeating-conic-gradient(#ffbe32 0 9deg,transparent 9deg 30deg);clip-path:polygon(50% 0,61% 28%,75% 7%,72% 39%,100% 50%,72% 61%,75% 93%,61% 72%,50% 100%,39% 72%,25% 93%,28% 61%,0 50%,28% 39%,25% 7%,39% 28%)}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}.stem{position:absolute;left:50%;bottom:0;width:9px;height:90px;background:#388e4b;transform:translateX(-50%)}.flower{position:absolute;left:50%;bottom:80px;width:100px;height:100px;transform:translateX(-50%);animation:bloom 4s ease-in-out infinite alternate}.petal{position:absolute;left:31px;top:0;width:38px;height:65px;border-radius:50%;background:#ed65a8;transform-origin:50% 50px;transform:rotate(var(--r));}.center{position:absolute;left:34px;top:34px;width:33px;height:33px;background:#ffcf3c;border-radius:50%;z-index:2}@keyframes bloom{from{transform:translateX(-50%) scale(.45) rotate(-10deg)}to{transform:translateX(-50%) scale(1) rotate(8deg)}}footer{text-align:center;color:#67738c;font-size:13px;margin:24px 0}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head><body><div class="wrap"><header><h1>✨ Magic English Cards</h1><p>See • Listen • Speak • Watch • Remember</p><p>6 animated vocabulary cards — demo</p></header><div class="grid" id="cards"></div><footer>Research project prototype • HTML + CSS animations • No external images required</footer></div><script>
const items=[['Butterfly','Көбелек','A butterfly flies from flower to flower.','<div class="butterfly"><div class="wing left"></div><div class="wing right"></div><div class="body"></div></div>'],['House','Үй','The house has a door and a window.','<div class="roof"></div><div class="house"><div class="window"></div><div class="doorframe"><div class="door"></div></div></div>'],['Volcano','Жанартау','The volcano erupts with hot lava.','<div class="volcano"></div><div class="crater"></div><div class="lava a"></div><div class="lava b"></div><div class="lava c"></div><div class="lava d"></div>'],['Heart','Жүрек','My heart beats every day.','<div class="heart">❤️</div>'],['Sun','Күн','The sun shines brightly.','<div class="rays"></div><div class="sun"></div>'],['Flower','Гүл','The flower opens in spring.','<div class="stem"></div><div class="flower">'+[0,60,120,180,240,300].map(n=>`<div class="petal" style="--r:${n}deg"></div>`).join('')+'<div class="center"></div></div>']];
const root=document.getElementById('cards');items.forEach(([en,kz,sentence,art])=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="scene" role="img" aria-label="Animated ${en}">${art}</div><div class="word">${en}</div><div class="translation">${kz}</div><p class="sentence">${sentence}</p><button class="btn" type="button">🔊 Listen</button>`;el.querySelector('button').addEventListener('click',()=>{if(!('speechSynthesis' in window)){alert('Speech is not supported in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(en+'. '+sentence);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)});root.appendChild(el)});
</script></body></html>
