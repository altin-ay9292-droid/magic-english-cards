<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Magic English QR Cards</title><style>body{font-family:Arial,sans-serif;background:#f1f5ff;color:#172554;margin:0;padding:20px}header{max-width:850px;margin:auto}input{padding:12px;width:95%;max-width:700px;border:1px solid #aab;border-radius:8px}button{padding:12px;border:0;background:#3055cf;color:white;border-radius:8px;cursor:pointer;margin:10px 0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:850px;margin:20px auto}.card{height:325px;background:white;border:4px solid #3b82f6;border-radius:16px;text-align:center;padding:12px;break-inside:avoid;box-sizing:border-box}.card.values{border-color:#a855f7}.card h2{font-size:25px;margin:8px}.emoji{font-size:72px}.qr{width:120px;height:120px;object-fit:contain}.sub{font-size:12px}#status{color:#b91c1c}@media print{@page{size:A4;margin:10mm}header{display:none}.cards{gap:6mm;max-width:none}.card{height:128mm;border-width:3px}.qr{width:36mm;height:36mm}}@media(max-width:540px){.cards{grid-template-columns:1fr}}</style><header><h1>Magic English Cards — QR басып шығару</h1><p>Сайтты интернетке жариялаған соң оның мекенжайын енгізіңіз. QR-кодтар интернет арқылы жасалады. QR-кодтарды тексеріп, содан кейін басып шығарыңыз.</p><label>Жарияланған сайт мекенжайы:</label><br><input id="base" placeholder="https://username.github.io/magic-english-cards/"><br><button id="generate">48 QR-карточка жасау</button> <button onclick="print()">А4 басып шығару</button><p id="status"></p></header><div class="cards" id="cards"></div><script>
const data=[['animals','Butterfly','🦋'],['animals','Dolphin','🐬'],['animals','Penguin','🐧'],['animals','Squirrel','🐿️'],['animals','Turtle','🐢'],['animals','Eagle','🦅'],['nature','Volcano','🌋'],['nature','Waterfall','🏞️'],['nature','Forest','🌲'],['nature','Island','🏝️'],['nature','Desert','🏜️'],['nature','Rainbow','🌈'],['feelings','Excited','🤩'],['feelings','Worried','😟'],['feelings','Proud','🥹'],['feelings','Surprised','😲'],['feelings','Bored','🥱'],['feelings','Nervous','😬'],['everyday','Compass','🧭'],['everyday','Backpack','🎒'],['everyday','Helmet','🪖'],['everyday','Flashlight','🔦'],['everyday','Suitcase','🧳'],['everyday','Umbrella','☂️'],['home','House','🏠'],['home','Flat','🏢'],['home','Kitchen','🍳'],['home','Bedroom','🛏️'],['home','Living room','🛋️'],['home','Bathroom','🛁'],['home','Garden','🌷'],['home','Sofa','🛋️'],['home','Wardrobe','🚪'],['home','Mirror','🪞'],['home','Balcony','🏙️'],['home','Neighbour','👋'],['values','Kindness','💛'],['values','Honesty','🤝'],['values','Friendship','🫂'],['values','Respect','🙏'],['values','Responsibility','📋'],['values','Helpfulness','🙌'],['values','Patience','🧘'],['values','Courage','🦁'],['values','Generosity','🎁'],['values','Politeness','😊'],['values','Teamwork','👥'],['values','Fairness','⚖️']];
const input=document.getElementById('base');input.value=location.protocol.startsWith('http')&&location.hostname&&!['localhost','127.0.0.1'].includes(location.hostname)?new URL('./',location.href).href:'';document.getElementById('generate').onclick=()=>{const b=input.value.trim();let url;try{url=new URL(b);if(!['https:','http:'].includes(url.protocol))throw Error()}catch(e){document.getElementById('status').textContent='Сайттың толық https:// мекенжайын енгізіңіз.';return}document.getElementById('status').textContent='QR-кодтарды басып шығарудан бұрын телефонмен тексеріңіз.';const root=document.getElementById('cards');root.innerHTML='';for(const [topic,word,emoji] of data){const link=new URL('index.html',url);link.searchParams.set('word',word);const el=document.createElement('article');el.className='card '+(topic==='values'?'values':'');const title=document.createElement('h2');title.textContent=word;const icon=document.createElement('div');icon.className='emoji';icon.textContent=emoji;const img=document.createElement('img');img.className='qr';img.alt='QR '+word;img.src='https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=10&data='+encodeURIComponent(link.href);const note=document.createElement('div');note.className='sub';note.textContent=topic==='home'?'Home and Away':topic==='values'?'Values':topic;el.append(title,icon,img,note);root.append(el)}};
</script></html>
