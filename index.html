<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic English Cards</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#17243d;background:#eaf4ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:20px auto;padding:16px}.hero{background:linear-gradient(115deg,#3259e8,#9b50db);border-radius:24px;color:white;padding:24px;text-align:center}h1{margin:0;font-size:2rem}.sub{opacity:.9}.modes{display:flex;gap:10px;margin:18px 0}.modes button{flex:1}.modes button:not(.active){background:white;color:#315ee9;border:2px solid #d4ddf4}select,button{font:inherit;border:0;border-radius:13px;padding:12px 16px}select{width:100%;background:white;border:1px solid #cad5eb;margin-top:10px}button{background:#315ee9;color:white;cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:default}.card{background:white;border-radius:24px;box-shadow:0 8px 30px #17366b22;padding:24px;margin-top:16px;text-align:center}.emoji{font-size:90px;line-height:1.4}.word{font-size:2.4rem;font-weight:800;margin:0}.translation{color:#576477;font-size:1.2rem}.sentence{font-size:1.12rem}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.secondary{background:#eef2ff;color:#2644b1}.quiz{margin-top:20px;text-align:left;background:#f6f9ff;border-radius:16px;padding:18px}.choices{display:grid;gap:9px;margin-top:12px}.choices button{text-align:left;background:white;color:#17243d;border:2px solid #dbe4f5}.choices button.good{border-color:#20a15c;background:#d9f9e7}.choices button.bad{border-color:#d74e4e;background:#ffe4e4}.feedback{min-height:30px;font-weight:800;text-align:center}.nav{display:flex;gap:12px;justify-content:space-between;margin-top:16px}.small{font-size:.85rem;color:#64748b}.stats{margin:12px 0;color:#52627e;text-align:center}.hidden{display:none!important}.result{font-size:1.3rem;font-weight:700;padding:24px}.hint{color:#536581;font-size:.95rem}@media(max-width:450px){.emoji{font-size:75px}.word{font-size:2rem}.card{padding:18px}.modes button{padding:12px 8px}}
/* Animated butterfly: CSS 3D perspective, no external downloads */
.butterfly-scene{height:175px;position:relative;perspective:650px;overflow:hidden;border-radius:20px;background:radial-gradient(ellipse at 50% 95%,#d9f9d9 0%,#f2faff 70%)}
.butterfly-fly{position:absolute;left:50%;top:39%;width:110px;height:100px;transform:translate(-50%,-50%);animation:flyPath 5s ease-in-out infinite;transform-style:preserve-3d;filter:drop-shadow(0 8px 7px #476c8a50)}
.butterfly-body{position:absolute;z-index:3;left:51px;top:27px;width:9px;height:55px;border-radius:60%;background:linear-gradient(90deg,#2a204b,#75558b,#261d48)}
.butterfly-body:before{content:'⌒';position:absolute;top:-20px;left:-7px;font-size:24px;color:#46356d;transform:rotate(-12deg)}
.wing{position:absolute;top:4px;width:56px;height:80px;transform-style:preserve-3d;backface-visibility:visible;background:radial-gradient(ellipse at 45% 45%,#f9d77c 0 10%,#f278ad 12% 31%,#7549d7 50%,#27389b 70%,#141f61 95%);border:3px solid #252477;box-shadow:inset 0 0 0 5px #ffffff70}
.wing.left{left:0;border-radius:85% 15% 70% 35%;transform-origin:right center;animation:wingLeft .38s ease-in-out infinite alternate}
.wing.right{right:0;border-radius:15% 85% 35% 70%;transform-origin:left center;animation:wingRight .38s ease-in-out infinite alternate}
.flower{position:absolute;bottom:4px;left:51%;font-size:46px;animation:flowerSway 3s ease-in-out infinite alternate}
@keyframes wingLeft{from{transform:rotateY(-68deg)}to{transform:rotateY(28deg)}}
@keyframes wingRight{from{transform:rotateY(68deg)}to{transform:rotateY(-28deg)}}
@keyframes flyPath{0%,100%{transform:translate(-80%,-56%) rotate(-10deg)}45%{transform:translate(-30%,-83%) rotate(10deg)}78%{transform:translate(-43%,-20%) rotate(0deg)}}
@keyframes flowerSway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media(prefers-reduced-motion:reduce){.butterfly-fly,.wing,.flower{animation:none!important}}
</style></head><body><main class="wrap"><header class="hero"><h1>✨ Magic English Cards</h1><div class="sub">See • Listen • Speak • Play • Remember</div></header><div class="modes"><button id="learnMode" class="active" aria-pressed="true">📚 Learn</button><button id="playMode" aria-pressed="false">🎮 Play</button></div><label for="topic"><strong>Choose a topic</strong></label><select id="topic"><option value="all">All cards</option><option value="home">Home and Away</option><option value="values">Values</option><option value="animals">Animals</option><option value="nature">Nature</option><option value="feelings">Feelings</option><option value="everyday">Everyday Life</option></select><div class="stats" id="stats"></div><section class="card"><div id="activity"><div class="emoji" id="emoji" role="img"></div><h2 class="word" id="word"></h2><div class="translation" id="translation"></div><p class="sentence" id="sentence"></p><div class="actions" id="learnActions"><button id="listen">🔊 Listen</button><button class="secondary" id="speak">🎤 Repeat</button></div><p id="speechstatus" class="small" aria-live="polite"></p><div class="quiz hidden" id="quiz"><strong>🎮 Choose the correct meaning:</strong><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p></div><div class="nav"><button class="secondary" id="prev">← Previous</button><button id="next">Next →</button></div></div><div id="results" class="hidden result" aria-live="polite"></div></section><p class="small" style="text-align:center">Made for a student research project • AI-generated content should be checked by the teacher • Speech recognition depends on the browser and permissions.</p></main><script>
const cards=[
['animals','Butterfly','Көбелек','🦋','A butterfly has colorful wings.'],['animals','Dolphin','Дельфин','🐬','A dolphin swims in the sea.'],['animals','Penguin','Пингвин','🐧','A penguin is a bird.'],['animals','Squirrel','Тиін','🐿️','A squirrel lives in a tree.'],['animals','Turtle','Тасбақа','🐢','A turtle moves slowly.'],['animals','Eagle','Бүркіт','🦅','An eagle can fly high.'],
['nature','Volcano','Жанартау','🌋','A volcano can release hot lava.'],['nature','Waterfall','Сарқырама','🏞️','A waterfall is beautiful.'],['nature','Forest','Орман','🌲','Many animals live in the forest.'],['nature','Island','Арал','🏝️','An island is surrounded by water.'],['nature','Desert','Шөл','🏜️','A desert is usually dry.'],['nature','Rainbow','Кемпірқосақ','🌈','We can see a rainbow after rain.'],
['feelings','Excited','Қуанышты, толқулы','🤩','I am excited about the trip.'],['feelings','Worried','Алаңдаулы','😟','She is worried about the test.'],['feelings','Proud','Мақтан тұтатын','🥹','I am proud of my friend.'],['feelings','Surprised','Таңғалған','😲','He is surprised by the gift.'],['feelings','Bored','Зерігіп отырған','🥱','I feel bored today.'],['feelings','Nervous','Қобалжыған','😬','She feels nervous before the exam.'],
['everyday','Compass','Компас','🧭','A compass shows directions.'],['everyday','Backpack','Арқа сөмке','🎒','My backpack is blue.'],['everyday','Helmet','Дулыға','🪖','Wear a helmet when cycling.'],['everyday','Flashlight','Қолшам','🔦','The flashlight is bright.'],['everyday','Suitcase','Шабадан','🧳','My suitcase is heavy.'],['everyday','Umbrella','Қолшатыр','☂️','I use an umbrella when it rains.'],
['home','House','Үй','🏠','My house is small.'],['home','Flat','Пәтер','🏢','We live in a flat.'],['home','Kitchen','Асүй','🍳','There is a table in the kitchen.'],['home','Bedroom','Жатын бөлме','🛏️','There is a bed in my bedroom.'],['home','Living room','Қонақ бөлме','🛋️','We watch TV in the living room.'],['home','Bathroom','Жуынатын бөлме','🛁','The bathroom is clean.'],['home','Garden','Бақ','🌷','There are flowers in the garden.'],['home','Sofa','Диван','🛋️','There is a sofa near the window.'],['home','Wardrobe','Киім шкафы','🚪','My clothes are in the wardrobe.'],['home','Mirror','Айна','🪞','There is a mirror on the wall.'],['home','Balcony','Балкон','🏙️','Our flat has a balcony.'],['home','Neighbour','Көрші','👋','Our neighbour is friendly.'],
['values','Kindness','Мейірімділік','💛','Kindness makes people happy.'],['values','Honesty','Адалдық','🤝','Honesty is important.'],['values','Friendship','Достық','🫂','Friendship is a great gift.'],['values','Respect','Құрмет','🙏','We show respect to others.'],['values','Responsibility','Жауапкершілік','📋','Responsibility means doing your duties.'],['values','Helpfulness','Көмекшілдік','🙌','Helpfulness makes our class better.'],['values','Patience','Шыдамдылық','🧘','Patience helps us learn.'],['values','Courage','Батылдық','🦁','Courage helps us face challenges.'],['values','Generosity','Жомарттық','🎁','Generosity means sharing with others.'],['values','Politeness','Әдептілік','😊','Politeness means saying please and thank you.'],['values','Teamwork','Бірлескен жұмыс','👥','Teamwork helps us succeed.'],['values','Fairness','Әділдік','⚖️','Fairness means treating people equally.']
].map(([topic,word,kz,emoji,sentence])=>({topic,word,kz,emoji,sentence}));
const $=id=>document.getElementById(id);let list=[],pos=0,score=0,answered=false,mode='learn',finished=false;const qs=new URLSearchParams(location.search);const initialWord=qs.get('word');function speak(t){if(!('speechSynthesis' in window)){$('speechstatus').textContent='Audio is not supported in this browser.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function render(){if(!list.length)return;let c=list[pos];$('activity').classList.toggle('hidden',finished);$('results').classList.toggle('hidden',!finished);if(finished){$('stats').textContent='Quiz completed';$('results').replaceChildren();let p=document.createElement('p');p.textContent=`🏆 Your score: ${score} / ${list.length} (${Math.round(score/list.length*100)}%)`;let b=document.createElement('button');b.textContent='Play again ↻';b.onclick=()=>{pos=0;score=0;finished=false;render()};$('results').append(p,b);return}if(c.word==='Butterfly'){$('emoji').innerHTML='<div class="butterfly-scene" role="img" aria-label="Animated colorful butterfly flying above a flower"><div class="butterfly-fly"><span class="wing left"></span><span class="wing right"></span><span class="butterfly-body"></span></div><span class="flower" aria-hidden="true">🌸</span></div>';}else{$('emoji').textContent=c.emoji;}$('word').textContent=c.word;$('translation').textContent=c.kz;$('sentence').textContent=c.sentence;$('translation').classList.toggle('hidden',mode==='play');$('sentence').classList.toggle('hidden',mode==='play');$('learnActions').classList.toggle('hidden',mode==='play');$('quiz').classList.toggle('hidden',mode!=='play');$('feedback').textContent='';$('speechstatus').textContent='';answered=false;$('stats').textContent=mode==='learn'?`Learn • Card ${pos+1} / ${list.length}`:`Play • Question ${pos+1} / ${list.length} • Score: ${score}`;if(mode==='play'){let others=shuffle(cards.filter(x=>x.kz!==c.kz)).slice(0,2);let options=shuffle([c,...others]);$('choices').replaceChildren();options.forEach(o=>{let b=document.createElement('button');b.textContent=o.kz;b.onclick=()=>{if(answered)return;answered=true;let ok=o.kz===c.kz;b.classList.add(ok?'good':'bad');$('feedback').textContent=ok?'⭐ Excellent! Correct!':'Not quite. Correct answer: '+c.kz;if(ok)score++;$('stats').textContent=`Play • Question ${pos+1} / ${list.length} • Score: ${score}`;[...$('choices').children].forEach(x=>{x.disabled=true;if(x.textContent===c.kz)x.classList.add('good')});$('next').disabled=false};$('choices').appendChild(b)})}$('prev').disabled=pos===0||mode==='play';$('next').disabled=mode==='play';$('next').textContent=mode==='play'&&pos===list.length-1?'See results →':pos===list.length-1?'Start again ↻':'Next →';history.replaceState(null,'',location.pathname+'?word='+encodeURIComponent(c.word))}function setTopic(topic){list=topic==='all'?cards:cards.filter(c=>c.topic===topic);pos=0;score=0;finished=false;render()}function setMode(m){mode=m;pos=0;score=0;finished=false;$('learnMode').classList.toggle('active',m==='learn');$('playMode').classList.toggle('active',m==='play');$('learnMode').setAttribute('aria-pressed',String(m==='learn'));$('playMode').setAttribute('aria-pressed',String(m==='play'));render()}$('topic').onchange=e=>setTopic(e.target.value);$('learnMode').onclick=()=>setMode('learn');$('playMode').onclick=()=>setMode('play');$('listen').onclick=()=>speak(list[pos].word+' . '+list[pos].sentence);$('speak').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('speechstatus').textContent='Microphone recognition is not supported here. Say the word aloud after listening.';return}let r=new SR();r.lang='en-US';r.onresult=e=>{$('speechstatus').textContent='You said: '+e.results[0][0].transcript+' (check your pronunciation with your teacher)'};r.onerror=e=>$('speechstatus').textContent='Microphone unavailable: '+e.error;r.start();$('speechstatus').textContent='Listening…'};$('prev').onclick=()=>{if(pos>0&&mode==='learn'){pos--;render()}};$('next').onclick=()=>{if(mode==='play'&&!answered)return;if(mode==='play'&&pos===list.length-1){finished=true;render();return}pos=(pos+1)%list.length;render()};if(initialWord){const c=cards.find(x=>x.word.toLowerCase()===initialWord.toLowerCase());if(c){$('topic').value=c.topic;setTopic(c.topic);pos=list.findIndex(x=>x.word===c.word);render()}else setTopic('all')}else setTopic('all');
</script></body></html>
