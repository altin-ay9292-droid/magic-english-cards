<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic English Cards</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#17243d;background:#eaf4ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:25px auto;padding:16px}.hero{background:linear-gradient(115deg,#3259e8,#9b50db);border-radius:24px;color:white;padding:24px;text-align:center}h1{margin:0;font-size:2rem}.sub{opacity:.9}select,button{font:inherit;border:0;border-radius:13px;padding:12px 16px}select{width:100%;background:white;border:1px solid #cad5eb;margin-top:14px}button{background:#315ee9;color:white;cursor:pointer;font-weight:700}button:disabled{opacity:.5}.card{background:white;border-radius:24px;box-shadow:0 8px 30px #17366b22;padding:24px;margin-top:16px;text-align:center}.emoji{font-size:100px;line-height:1.4}.word{font-size:2.4rem;font-weight:800;margin:0}.translation{color:#576477;font-size:1.2rem}.sentence{font-size:1.12rem}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.secondary{background:#eef2ff;color:#2644b1}.quiz{margin-top:20px;text-align:left;background:#f6f9ff;border-radius:16px;padding:18px}.choices{display:grid;gap:9px}.choices button{text-align:left;background:white;color:#17243d;border:2px solid #dbe4f5}.choices button.good{border-color:#20a15c;background:#d9f9e7}.choices button.bad{border-color:#d74e4e;background:#ffe4e4}.feedback{min-height:30px;font-weight:800;text-align:center}.nav{display:flex;gap:12px;justify-content:space-between;margin-top:16px}.small{font-size:.85rem;color:#64748b}.stats{margin:12px 0;color:#52627e;text-align:center}@media(max-width:450px){.emoji{font-size:80px}.word{font-size:2rem}}</style></head><body><main class="wrap"><header class="hero"><h1>✨ Magic English Cards</h1><div class="sub">See • Listen • Speak • Play • Remember</div></header><label for="topic"><strong>Choose a topic</strong></label><select id="topic"><option value="all">All cards</option><option value="home">Home and Away</option><option value="values">Values</option><option value="animals">Animals</option><option value="nature">Nature</option><option value="feelings">Feelings</option><option value="everyday">Everyday Life</option></select><div class="stats" id="stats"></div><section class="card"><div class="emoji" id="emoji" role="img"></div><h2 class="word" id="word"></h2><div class="translation" id="translation"></div><p class="sentence" id="sentence"></p><div class="actions"><button id="listen">🔊 Listen</button><button class="secondary" id="speak">🎤 Repeat</button></div><p id="speechstatus" class="small" aria-live="polite"></p><div class="quiz"><strong>🎮 Choose the correct meaning:</strong><div class="choices" id="choices"></div><p class="feedback" id="feedback" aria-live="polite"></p></div><div class="nav"><button class="secondary" id="prev">← Previous</button><button id="next">Next →</button></div></section><p class="small" style="text-align:center">Made for a student research project • AI-generated content should be checked by the teacher • Speech recognition depends on the browser and permissions.</p></main><script>
const cards=[
['animals','Butterfly','Көбелек','🦋','A butterfly has colorful wings.'],['animals','Dolphin','Дельфин','🐬','A dolphin swims in the sea.'],['animals','Penguin','Пингвин','🐧','A penguin is a bird.'],['animals','Squirrel','Тиін','🐿️','A squirrel lives in a tree.'],['animals','Turtle','Тасбақа','🐢','A turtle moves slowly.'],['animals','Eagle','Бүркіт','🦅','An eagle can fly high.'],
['nature','Volcano','Жанартау','🌋','A volcano can release hot lava.'],['nature','Waterfall','Сарқырама','🏞️','A waterfall is beautiful.'],['nature','Forest','Орман','🌲','Many animals live in the forest.'],['nature','Island','Арал','🏝️','An island is surrounded by water.'],['nature','Desert','Шөл','🏜️','A desert is usually dry.'],['nature','Rainbow','Кемпірқосақ','🌈','We can see a rainbow after rain.'],
['feelings','Excited','Қуанышты, толқулы','🤩','I am excited about the trip.'],['feelings','Worried','Алаңдаулы','😟','She is worried about the test.'],['feelings','Proud','Мақтан тұтатын','🥹','I am proud of my friend.'],['feelings','Surprised','Таңғалған','😲','He is surprised by the gift.'],['feelings','Bored','Зерігіп отырған','🥱','I feel bored today.'],['feelings','Nervous','Қобалжыған','😬','She feels nervous before the exam.'],
['everyday','Compass','Компас','🧭','A compass shows directions.'],['everyday','Backpack','Арқа сөмке','🎒','My backpack is blue.'],['everyday','Helmet','Дулыға','🪖','Wear a helmet when cycling.'],['everyday','Flashlight','Қолшам','🔦','The flashlight is bright.'],['everyday','Suitcase','Шабадан','🧳','My suitcase is heavy.'],['everyday','Umbrella','Қолшатыр','☂️','I use an umbrella when it rains.'],
['home','House','Үй','🏠','My house is small.'],['home','Flat','Пәтер','🏢','We live in a flat.'],['home','Kitchen','Асүй','🍳','There is a table in the kitchen.'],['home','Bedroom','Жатын бөлме','🛏️','There is a bed in my bedroom.'],['home','Living room','Қонақ бөлме','🛋️','We watch TV in the living room.'],['home','Bathroom','Жуынатын бөлме','🛁','The bathroom is clean.'],['home','Garden','Бақ','🌷','There are flowers in the garden.'],['home','Sofa','Диван','🛋️','There is a sofa near the window.'],['home','Wardrobe','Киім шкафы','🚪','My clothes are in the wardrobe.'],['home','Mirror','Айна','🪞','There is a mirror on the wall.'],['home','Balcony','Балкон','🏙️','Our flat has a balcony.'],['home','Neighbour','Көрші','👋','Our neighbour is friendly.'],
['values','Kindness','Мейірімділік','💛','Kindness makes people happy.'],['values','Honesty','Адалдық','🤝','Honesty is important.'],['values','Friendship','Достық','🫂','Friendship is a great gift.'],['values','Respect','Құрмет','🙏','We show respect to others.'],['values','Responsibility','Жауапкершілік','📋','Responsibility means doing your duties.'],['values','Helpfulness','Көмекшілдік','🙌','Helpfulness makes our class better.'],['values','Patience','Шыдамдылық','🧘','Patience helps us learn.'],['values','Courage','Батылдық','🦁','Courage helps us face challenges.'],['values','Generosity','Жомарттық','🎁','Generosity means sharing with others.'],['values','Politeness','Әдептілік','😊','Politeness means saying please and thank you.'],['values','Teamwork','Бірлескен жұмыс','👥','Teamwork helps us succeed.'],['values','Fairness','Әділдік','⚖️','Fairness means treating people equally.']
].map(([topic,word,kz,emoji,sentence])=>({topic,word,kz,emoji,sentence}));
const $=id=>document.getElementById(id);let list=[],pos=0,score=0,answered=false;const qs=new URLSearchParams(location.search);const initialWord=qs.get('word');function speak(t){if(!('speechSynthesis' in window)){ $('speechstatus').textContent='Audio is not supported in this browser.';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function render(){let c=list[pos];if(!c)return;$('emoji').textContent=c.emoji;$('word').textContent=c.word;$('translation').textContent=c.kz;$('sentence').textContent=c.sentence;$('stats').textContent=`Card ${pos+1} / ${list.length} • Correct answers: ${score}`;$('feedback').textContent='';$('speechstatus').textContent='';answered=false;let others=shuffle(cards.filter(x=>x.kz!==c.kz)).slice(0,2);let options=shuffle([c,...others]);$('choices').innerHTML='';options.forEach(o=>{let b=document.createElement('button');b.textContent=o.kz;b.onclick=()=>{if(answered)return;answered=true;let ok=o.kz===c.kz;b.classList.add(ok?'good':'bad');$('feedback').textContent=ok?'⭐ Excellent! Correct!':'Try again! Correct answer: '+c.kz;if(ok)score++;$('stats').textContent=`Card ${pos+1} / ${list.length} • Correct answers: ${score}`;[...$('choices').children].forEach(x=>{x.disabled=true;if(x.textContent===c.kz)x.classList.add('good')})};$('choices').appendChild(b)});$('prev').disabled=pos===0;$('next').textContent=pos===list.length-1?'Start again ↻':'Next →';history.replaceState(null,'',location.pathname+'?word='+encodeURIComponent(c.word))}function setTopic(topic){list=topic==='all'?cards:cards.filter(c=>c.topic===topic);pos=0;score=0;render()}$('topic').onchange=e=>setTopic(e.target.value);$('listen').onclick=()=>speak(list[pos].word+' . '+list[pos].sentence);$('speak').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('speechstatus').textContent='Microphone recognition is not supported here. Say the word aloud after listening.';return}let r=new SR();r.lang='en-US';r.onresult=e=>{$('speechstatus').textContent='You said: '+e.results[0][0].transcript+' (check your pronunciation with your teacher)'};r.onerror=e=>$('speechstatus').textContent='Microphone unavailable: '+e.error;r.start();$('speechstatus').textContent='Listening…'};$('prev').onclick=()=>{if(pos>0){pos--;render()}};$('next').onclick=()=>{pos=(pos+1)%list.length;if(pos===0)score=0;render()};if(initialWord){const c=cards.find(x=>x.word.toLowerCase()===initialWord.toLowerCase());if(c){$('topic').value=c.topic;setTopic(c.topic);pos=list.findIndex(x=>x.word===c.word);render()}else setTopic('all')}else setTopic('all');
</script></body></html>
